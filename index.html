<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucky Wheel</title>
<style>
:root{color-scheme:dark;--bg:#0b132b;--surface:#1c2541;--ink:#e8f1f2;--muted:#9fb2c7;--line:#3a506b;--accent:#5bc0be;--accent-ink:#0b132b;--danger:#ff7a8c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b132b;--surface:#1c2541;--ink:#e8f1f2;--muted:#9fb2c7;--line:#3a506b;--accent:#5bc0be;--accent-ink:#0b132b;--danger:#ff7a8c}}
:root[data-theme="dark"]{--bg:#0b132b;--surface:#1c2541;--ink:#e8f1f2;--muted:#9fb2c7;--line:#3a506b;--accent:#5bc0be;--accent-ink:#0b132b;--danger:#ff7a8c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Grandview,"Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 40px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid var(--line)}
nav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav button.new{border-style:dashed;color:var(--accent)}
h1{font-size:clamp(2.4rem,8vw,4rem);line-height:1;margin:18px 0 8px;font-weight:800;letter-spacing:-.03em}
.sub{color:var(--muted);margin:0 0 24px;font-size:1.1rem}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:.9rem}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card .open{border:0;background:transparent;text-align:left;padding:0}
.card h3{margin:0 0 4px;font-size:1.3rem;overflow-wrap:anywhere}
.card small{color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h2{margin:0;font-size:clamp(1.6rem,5vw,2.2rem);overflow-wrap:anywhere}
.cols{display:grid;gap:28px;grid-template-columns:1fr}
@media(min-width:820px){.cols{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}
.stage{position:relative;width:100%;max-width:460px;margin:0 auto}
canvas{display:block;width:100%;aspect-ratio:1;border-radius:50%;box-shadow:0 12px 40px rgba(91,192,190,.2)}
.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-top:32px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2}
.spin{display:block;margin:22px auto 0;font-weight:800;font-size:1.25rem;padding:14px 56px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.spin:disabled{opacity:.45;cursor:not-allowed}
.result{min-height:4.2em;text-align:center;margin-top:16px}
.result strong{display:block;font-size:clamp(1.6rem,5vw,2.2rem);overflow-wrap:anywhere}
.result span{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.add{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;width:100%;background:transparent;text-align:left}
.toggle small{display:block;color:var(--muted)}
.sw{flex:none;width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-checked="true"] .sw{background:var(--accent)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(20px)}
h4{font-size:1rem;margin:16px 0 8px}
ul{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto}
li{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}
li i{flex:none;width:14px;height:14px;border-radius:50%}
li span{flex:1;overflow-wrap:anywhere}
li button{border:0;background:transparent;padding:2px 8px;font-size:1.05rem}
li .del{color:var(--danger);font-size:1.3rem}
.empty{color:var(--muted);padding:8px 0}
.out li span{text-decoration:line-through;color:var(--muted)}
.link{border:0;background:transparent;color:var(--accent);padding:0;font-weight:700}
h4 .link{margin-left:10px}
#histList{max-height:170px}
canvas{cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(10,8,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:380px;display:grid;gap:14px}
#modal h3{margin:0}
#modal .acts{justify-content:flex-end}
#modal p{margin:0;color:var(--muted)}
@media(prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}
</style>
<meta name="theme-color" content="#0b132b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lucky Wheel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <nav id="nav" aria-label="Wheels"></nav>

  <section id="home">
    <h1>Welcome</h1>
    <p class="sub">Pick a wheel to spin, or create a new one.</p>
    <button class="btn" id="newHome" type="button">New wheel</button>
    <div class="grid" id="grid"></div>
  </section>

  <section id="view" hidden>
    <div class="top">
      <h2 id="wname"></h2>
      <div class="acts">
        <button class="btn ghost sm" id="rename" type="button">Rename</button>
        <button class="btn ghost sm" id="dup" type="button">Duplicate</button>
        <button class="btn danger sm" id="delWheel" type="button">Delete wheel</button>
      </div>
    </div>
    <div class="cols">
      <div>
        <div class="stage"><div class="pointer"></div><canvas id="wheel" aria-label="Lucky wheel"></canvas></div>
        <button class="spin" id="spin" type="button">Spin</button>
        <div class="result" id="result" aria-live="polite"></div>
      </div>
      <div class="panel">
        <div class="add">
          <input id="name" type="text" placeholder="Type an item" maxlength="60" autocomplete="off" aria-label="New item">
          <button class="btn" id="add" type="button">Add</button>
        </div>
        <button class="toggle" id="elim" role="switch" aria-checked="false" type="button">
          <div>Eliminate winners<small>Remove each pick after it lands</small></div><div class="sw"></div>
        </button>
        <h4>On the wheel (<span id="count">0</span>) <button class="link" id="shuffle" type="button">Shuffle</button> <button class="link" id="clear" type="button">Clear all</button></h4>
        <ul id="items"></ul>
        <div id="histWrap" hidden><h4>Recent spins <button class="link" id="clearHist" type="button">Clear</button></h4><ul id="histList"></ul></div>
        <div id="outWrap" hidden>
          <h4>Eliminated (<span id="outCount">0</span>) <button class="link" id="restore" type="button">Restore all</button></h4>
          <ul class="out" id="outList"></ul>
        </div>
      </div>
    </div>
  </section>
</div>

<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="box">
    <h3 id="mt"></h3><p id="mp" hidden></p>
    <input id="mi" type="text" maxlength="60" autocomplete="off" aria-labelledby="mt">
    <div class="acts"><button class="btn ghost" id="mc" type="button">Cancel</button><button class="btn" id="mo" type="button">OK</button></div>
  </div>
</div>

<script>
(function(){
  var TAU=Math.PI*2, KEY="luckywheels-v1";
  var $=function(id){return document.getElementById(id)};
  var PAL=[["#5bc0be","#0b132b"],["#3a506b","#fff"],["#2e8f94","#fff"],["#4f6d8f","#fff"],["#8fd6d4","#0b132b"],["#2b3f5c","#fff"]];
  var color=function(i){return PAL[i%PAL.length][0]};
  var rnd=function(){return crypto.getRandomValues(new Uint32Array(1))[0]/4294967296};
  var uid=function(){return Date.now().toString(36)+Math.floor(rnd()*1e6).toString(36)};
  var wheels=[], cur=null, spinning=false, tok=0, rot=0;
  var cv=$("wheel"), ctx=cv.getContext("2d");

  try{wheels=JSON.parse(localStorage.getItem(KEY)||"[]");}catch(e){wheels=[];}
  if(!Array.isArray(wheels)||!wheels.length)wheels=[{id:uid(),name:"Lunch picker",items:["Pizza","Tacos","Sushi","Burgers"],out:[],elim:false}];
  function save(){try{localStorage.setItem(KEY,JSON.stringify(wheels));}catch(e){}}

  /* modal */
  var mcb=null;
  function ask(o,cb){
    $("mt").textContent=o.title;
    var p=$("mp");p.hidden=!o.text;p.textContent=o.text||"";
    var i=$("mi");i.hidden=!o.input;i.value=o.value||"";
    var ok=$("mo");ok.textContent=o.ok||"OK";
    ok.className=o.danger?"btn danger":"btn";
    mcb=cb;$("modal").hidden=false;
    (o.input?i:ok).focus();if(o.input)i.select();
  }
  function closeM(){$("modal").hidden=true;mcb=null;}
  function okM(){var v=$("mi").value.trim(),cb=mcb;if(!$("mi").hidden&&!v)return;closeM();if(cb)cb(v);}
  $("mo").onclick=okM;$("mc").onclick=closeM;
  $("modal").addEventListener("keydown",function(e){if(e.key==="Enter")okM();if(e.key==="Escape")closeM();});

  /* wheel actions */
  function newWheel(){
    ask({title:"New wheel",input:true,ok:"Create"},function(v){
      var w={id:uid(),name:v,items:[],out:[],elim:false};
      wheels.push(w);save();location.hash="#wheel-"+w.id;
    });
  }
  function renameWheel(w){
    ask({title:"Rename wheel",input:true,value:w.name,ok:"Save"},function(v){w.name=v;save();route();});
  }
  function deleteWheel(w){
    ask({title:"Delete “"+w.name+"”?",text:"This wheel and its items will be removed for good.",ok:"Delete",danger:true},function(){
      wheels=wheels.filter(function(x){return x!==w});save();
      if(cur===w){location.hash="#home";}
      route();
    });
  }

  /* routing + nav */
  function route(){
    tok++;spinning=false;
    var m=/^#wheel-(\w+)$/.exec(location.hash);
    cur=null;
    if(m)wheels.forEach(function(w){if(w.id===m[1])cur=w;});
    $("home").hidden=!!cur;$("view").hidden=!cur;
    drawNav();
    if(cur){$("wname").textContent=cur.name;$("elim").setAttribute("aria-checked",cur.elim);$("result").innerHTML="";$("name").value="";renderView();draw();}
    else renderHome();
  }
  function drawNav(){
    var n=$("nav");n.innerHTML="";
    function chip(t,on,cls,fn){var b=document.createElement("button");b.type="button";b.textContent=t;b.className=(on?"on ":"")+(cls||"");if(on)b.setAttribute("aria-current","page");b.onclick=fn;n.appendChild(b);}
    chip("Home",!cur,"",function(){location.hash="#home"});
    wheels.forEach(function(w){chip(w.name,w===cur,"",function(){location.hash="#wheel-"+w.id});});
    chip("+ New wheel",false,"new",newWheel);
  }
  function renderHome(){
    var g=$("grid");g.innerHTML="";
    wheels.forEach(function(w){
      var c=document.createElement("div");c.className="card";
      var o=document.createElement("button");o.type="button";o.className="open";
      var h=document.createElement("h3");h.textContent=w.name;
      var s=document.createElement("small");s.textContent=w.items.length+(w.items.length===1?" item":" items");
      o.appendChild(h);o.appendChild(s);o.onclick=function(){location.hash="#wheel-"+w.id};
      var d=document.createElement("div");d.className="dots";
      w.items.slice(0,24).forEach(function(_,i){var e=document.createElement("i");e.style.background=color(i);d.appendChild(e);});
      var a=document.createElement("div");a.className="acts";
      [["Open","btn sm",function(){location.hash="#wheel-"+w.id}],["Rename","btn ghost sm",function(){renameWheel(w)}],["Duplicate","btn ghost sm",function(){dupWheel(w)}],["Delete","btn danger sm",function(){deleteWheel(w)}]].forEach(function(x){
        var b=document.createElement("button");b.type="button";b.textContent=x[0];b.className=x[1];b.onclick=x[2];a.appendChild(b);});
      c.appendChild(o);c.appendChild(d);c.appendChild(a);g.appendChild(c);
    });
    if(!wheels.length){var e=document.createElement("p");e.className="sub";e.textContent="No wheels yet. Create your first one.";g.appendChild(e);}
  }

  /* wheel view */
  function row(list,name,idx,live){
    var li=document.createElement("li");
    var dot=document.createElement("i");dot.style.background=live?color(idx):"#3a506b";
    var sp=document.createElement("span");sp.textContent=name;
    li.appendChild(dot);li.appendChild(sp);
    if(live){
      var e=document.createElement("button");e.type="button";e.textContent="Edit";e.setAttribute("aria-label","Edit "+name);
      e.onclick=function(){if(spinning)return;ask({title:"Edit item",input:true,value:cur.items[idx],ok:"Save"},function(v){cur.items[idx]=v;save();renderView();draw();});};
      var b=document.createElement("button");b.type="button";b.className="del";b.textContent="\u00d7";b.setAttribute("aria-label","Remove "+name);
      b.onclick=function(){if(spinning)return;cur.items.splice(idx,1);save();renderView();draw();};
      li.appendChild(e);li.appendChild(b);
    }
    list.appendChild(li);
  }
  function renderView(){
    if(!cur)return;
    var ul=$("items");ul.innerHTML="";
    cur.items.forEach(function(n,i){row(ul,n,i,true)});
    if(!cur.items.length){var e=document.createElement("li");e.className="empty";e.textContent="No items yet. Add one above.";ul.appendChild(e);}
    $("count").textContent=cur.items.length;
    var ol=$("outList");ol.innerHTML="";
    cur.out.forEach(function(n,i){row(ol,n,i,false)});
    $("outCount").textContent=cur.out.length;$("outWrap").hidden=!cur.out.length;
    $("spin").disabled=spinning||cur.items.length<2;
    var hl=$("histList");hl.innerHTML="";var H=cur.history||[];
    H.forEach(function(n,i){var li=document.createElement("li");var sp=document.createElement("span");sp.textContent=(H.length-i)+". "+n;li.appendChild(sp);hl.appendChild(li);});
    $("histWrap").hidden=!H.length;
  }
  function draw(){
    if(!cur)return;
    var items=cur.items,dpr=window.devicePixelRatio||1,s=cv.clientWidth;
    if(!s)return;
    cv.width=s*dpr;cv.height=s*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    var c=s/2,r=c-4,n=items.length;
    ctx.clearRect(0,0,s,s);
    if(!n){
      ctx.beginPath();ctx.arc(c,c,r,0,TAU);ctx.fillStyle="#3a506b";ctx.fill();
      ctx.fillStyle="#fff";ctx.font="700 "+(s/18)+"px Grandview,'Segoe UI',sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("Add items to begin",c,c);return;
    }
    var seg=TAU/n;
    for(var i=0;i<n;i++){
      var a0=rot+i*seg;
      ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a0,a0+seg);ctx.closePath();
      ctx.fillStyle=color(i);ctx.fill();
      if(n>1){ctx.strokeStyle="rgba(11,19,43,.85)";ctx.lineWidth=2;ctx.stroke();}
      if(n<=60){
        var fs=Math.max(9,Math.min(s/22,r*seg*0.4));
        ctx.save();ctx.translate(c,c);ctx.rotate(a0+seg/2);
        ctx.font="700 "+fs+"px Grandview,'Segoe UI',sans-serif";ctx.textAlign="right";ctx.textBaseline="middle";
        ctx.fillStyle=PAL[i%PAL.length][1];ctx.shadowColor="rgba(0,0,0,.3)";ctx.shadowBlur=PAL[i%PAL.length][1]==="#fff"?3:0;
        var t=items[i],maxW=r*0.66;
        while(t.length>1&&ctx.measureText(t).width>maxW)t=t.slice(0,-1);
        if(t!==items[i])t=t.slice(0,-1)+"\u2026";
        ctx.fillText(t,r-14,0);ctx.restore();
      }
    }
    ctx.beginPath();ctx.arc(c,c,s*0.055,0,TAU);
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--surface").trim()||"#fff";
    ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="rgba(0,0,0,.15)";ctx.stroke();
  }
  function show(main,sub){
    var r=$("result");r.innerHTML="";
    var s=document.createElement("strong");s.textContent=main;r.appendChild(s);
    if(sub){var p=document.createElement("span");p.textContent=sub;r.appendChild(p);}
  }
  function addItem(){
    var inp=$("name"),v=inp.value.trim();
    if(!v||!cur||spinning)return;
    cur.items.push(v);inp.value="";inp.focus();save();renderView();draw();
  }
  function spin(){
    var w=cur;
    if(!w||spinning||w.items.length<2)return;
    spinning=true;var my=++tok;$("result").innerHTML="";renderView();
    var start=rot,total=(6+Math.floor(rnd()*4))*TAU+rnd()*TAU,dur=5200,t0=null;
    function step(now){
      if(my!==tok)return;
      if(t0===null)t0=now;
      var t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-t,4);
      rot=start+total*e;draw();
      if(t<1){requestAnimationFrame(step);return;}
      rot=rot%TAU;
      var seg=TAU/w.items.length,ang=(((-Math.PI/2-rot)%TAU)+TAU)%TAU;
      var idx=Math.min(w.items.length-1,Math.floor(ang/seg)),win=w.items[idx];
      w.history=w.history||[];w.history.unshift(win);w.history=w.history.slice(0,10);save();
      spinning=false;
      if(w.elim){
        show(win,"Eliminated from the wheel");renderView();
        setTimeout(function(){
          if(my!==tok)return;
          w.items.splice(idx,1);w.out.push(win);save();renderView();draw();
          if(w.items.length===1)show(w.items[0],"Last one standing");
        },1000);
      }else{show(win,"The wheel has spoken");renderView();}
    }
    requestAnimationFrame(step);
  }

  function dupWheel(w){var c={id:uid(),name:w.name+" copy",items:w.items.concat(w.out),out:[],elim:w.elim,history:[]};wheels.push(c);save();location.hash="#wheel-"+c.id;}
  $("newHome").onclick=newWheel;
  $("dup").onclick=function(){if(cur)dupWheel(cur)};
  $("shuffle").onclick=function(){if(!cur||spinning)return;var a=cur.items;for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}save();renderView();draw();};
  $("clear").onclick=function(){if(!cur||spinning||!cur.items.length)return;ask({title:"Clear all items?",text:"Every item on this wheel will be removed.",ok:"Clear all",danger:true},function(){cur.items=[];cur.out=[];save();$("result").innerHTML="";renderView();draw();});};
  $("clearHist").onclick=function(){if(!cur)return;cur.history=[];save();renderView();};
  cv.onclick=spin;
  $("rename").onclick=function(){if(cur)renameWheel(cur)};
  $("delWheel").onclick=function(){if(cur)deleteWheel(cur)};
  $("add").onclick=addItem;
  $("name").addEventListener("keydown",function(e){if(e.key==="Enter")addItem();});
  $("spin").onclick=spin;
  $("elim").onclick=function(){if(!cur)return;cur.elim=!cur.elim;this.setAttribute("aria-checked",cur.elim);save();};
  $("restore").onclick=function(){if(!cur||spinning)return;cur.items=cur.items.concat(cur.out);cur.out=[];save();$("result").innerHTML="";renderView();draw();};
  window.addEventListener("hashchange",route);
  window.addEventListener("resize",draw);
  if(window.matchMedia)window.matchMedia("(prefers-color-scheme:dark)").addEventListener("change",draw);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
  route();
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
</body>
</html>
